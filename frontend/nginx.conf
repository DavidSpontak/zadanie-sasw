server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Docker's DNS; re-resolve "backend" so a restarted backend container (new IP) keeps working
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location / {
        try_files $uri /index.html;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Forward API calls to the backend container (same origin for the browser, so no CORS needed)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # a 7B model on CPU can take a few minutes per answer
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # FastAPI's interactive API docs
    location = /docs         { proxy_pass $backend; }
    location = /openapi.json { proxy_pass $backend; }
}
